<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Enenra</title>
  <desc id="desc">Banner oscuro con acentos cian y violeta para el portafolio de proyectos y certificaciones de Enenra.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="55%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#11152e" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="52%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#155e75" stroke-width="1" opacity="0.22" />
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#background)" />
  <rect width="1200" height="300" rx="24" fill="url(#grid)" />
  <path d="M0 238H250L294 194H410M1200 238H950L906 194H790" fill="none" stroke="#164e63" stroke-width="2" opacity="0.7" />
  <path d="M0 254H1200" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.72" />
  <rect x="26" y="24" width="1148" height="252" rx="20" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.48" />
  <circle cx="294" cy="194" r="4" fill="#22d3ee" />
  <circle cx="906" cy="194" r="4" fill="#c084fc" />
  <text x="600" y="144" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="10" fill="#67e8f9" filter="url(#glow)">ENENRA</text>
  <text x="600" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="5" fill="#a5b4fc">PROYECTOS · CERTIFICACIONES</text>
  <text x="64" y="58" font-family="Consolas, monospace" font-size="12" letter-spacing="2" fill="#22d3ee" opacity="0.7">PORTFOLIO // 01</text>
  <text x="1136" y="58" text-anchor="end" font-family="Consolas, monospace" font-size="12" letter-spacing="2" fill="#c084fc" opacity="0.7">NETWORK · SYSTEMS</text>
</svg>
